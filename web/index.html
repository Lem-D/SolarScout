<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solar Scout</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="map"></div>

    <header id="topbar">
      <div class="brand">
        <h1>Solar Scout</h1>
        <p id="region-name">loading…</p>
      </div>

      <div class="controls">
        <label class="control">
          <span class="control-label">
            Electricity price
            <output id="price-out"></output>
          </span>
          <input id="price" type="range" step="0.005" />
        </label>
        <div class="control-row">
          <label class="toggle">
            <input id="detailed" type="checkbox" />
            <span>Account for panel ageing</span>
          </label>
          <button id="draw-toggle" type="button" class="btn">Select an area</button>
          <button id="assumptions-open" type="button" class="btn btn-quiet">Assumptions</button>
        </div>
      </div>
    </header>

    <div id="notice" hidden></div>

    <!-- Payback bands. Labelled, because colour never carries the meaning alone. -->
    <div id="legend">
      <h2>Years to pay back</h2>
      <ul>
        <li><i class="sw sw-good"></i><span id="legend-good"></span></li>
        <li><i class="sw sw-warn"></i><span id="legend-warn"></span></li>
        <li><i class="sw sw-grey"></i><span>longer, or too small</span></li>
      </ul>
      <p id="legend-foot"></p>
    </div>

    <aside id="panel" hidden>
      <button id="panel-close" type="button" aria-label="Close">×</button>
      <div id="panel-body"></div>
    </aside>

    <aside id="summary" hidden>
      <button id="summary-close" type="button" aria-label="Close">×</button>
      <div id="summary-body"></div>
    </aside>

    <dialog id="assumptions">
      <button id="assumptions-close" type="button" aria-label="Close">×</button>
      <div id="assumptions-body"></div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
